[package]
name = "daw"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
# --- audio i/o — RED ZONE ---
rtaudio           = { version = "0.8.0", features = ["jack_linux"] }

# --- rt-safe plumbing — RED ZONE ---
rtrb              = "0.4.0"
triple_buffer     = "9.0.0"
basedrop          = "0.1.3"
thunderdome       = "0.6"
assert_no_alloc   = "1.1.2"

# --- streaming & media ---
creek             = "1.2.3"
symphonium        = "0.12.2"
fixed-resample    = "0.12.1"
hound             = "3.5.1"

# --- plugins ---
clack-host        = "0.1.1"

# --- ui — GREEN ---
# `persistence` is NOT a default feature: without it `App::save` is never
# called and `CreationContext::storage` is None — UI prefs silently vanish.
eframe            = { version = "0.36.1", features = ["persistence"] }
egui              = "0.36.1"
wgpu              = "30.0.1"
lyon              = "1.0.19"
bytemuck          = "1.25.2"
glam              = "0.33.5"

# --- state & general ---
serde             = { version = "1.0.229", features = ["derive"] }
ron               = "0.12.2"
thiserror         = "2.0.20"
crossbeam-channel = "0.5.16"
parking_lot       = "0.12.5"

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
