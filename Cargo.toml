[package]
name = "daw"
version = "0.1.0"
edition = "2024"

[workspace]

# The audio-only build has no visual compiler, renderer, exporter or frame hook.
[features]
default = []
visuals = []

[[example]]
name = "visual_score"
required-features = ["visuals"]

[dependencies]

# --- corpus kernels — GREEN ---
# The same geometry and colour the cockpit draws with, so the two apps are
# two panels of one console. `package =` renames where a kernel's name
# would collide with a module here.
chamfer      = { path = "/home/naiqvist/Corpus/kernels/geometry/chamfer" }
bracket      = { path = "/home/naiqvist/Corpus/kernels/geometry/bracket" }
dash         = { path = "/home/naiqvist/Corpus/kernels/raster/dash" }
corpus_rect  = { package = "rect", path = "/home/naiqvist/Corpus/kernels/geometry/rect" }
corpus_panel = { package = "panel", path = "/home/naiqvist/Corpus/alloys/geometry/panel" }
truncate     = { path = "/home/naiqvist/Corpus/kernels/typography/truncate" }
tunable      = { path = "/home/naiqvist/Corpus/kernels/code/tunable" }
theme_file   = { package = "theme", path = "/home/naiqvist/Corpus/kernels/color/theme" }
oklab        = { path = "/home/naiqvist/Corpus/kernels/color/oklab" }
contrast     = { path = "/home/naiqvist/Corpus/kernels/color/contrast" }
watch        = { path = "/home/naiqvist/Corpus/kernels/io/watch" }
# --- audio i/o — RED ZONE ---
rtaudio           = { version = "0.8.0", features = ["jack_linux"] }

# --- MIDI input — GREEN ZONE ---
# ALSA seq on Linux, CoreMIDI on macOS, WinMM on Windows. NOT the `jack`
# feature, and not the jack crate: the backend note already traded JACK
# integration for cross-platform reach, and THE GOTCHA makes JACK
# presence unreliable by construction here — rtaudio silently builds
# without it. Binding MIDI to JACK would stack a second invisible failure
# behind the first. See notes/20260831-midi-and-tempo-decisions.md.
midir             = "0.10"

# --- rt-safe plumbing — RED ZONE ---
rtrb              = "0.4.0"
triple_buffer     = "9.0.0"
basedrop          = "0.1.3"
thunderdome       = "0.6"
assert_no_alloc   = "1.1.2"

# --- streaming & media ---
creek             = "1.2.3"
# `flac`/`mp3`/`aiff` on top of the default wav+ogg: a sample library is
# made of exactly those, and the sampler loads whole files rather than
# streaming them, so this is the only decoder that sees them.
symphonium        = { version = "0.12.2", features = ["flac", "mp3", "aiff"] }
fixed-resample    = "0.12.1"
hound             = "3.5.1"

# --- plugins ---
clack-host        = "0.1.1"

# --- ui — GREEN ---
# `persistence` is NOT a default feature: without it `App::save` is never
# called and `CreationContext::storage` is None — UI prefs silently vanish.
eframe            = { version = "0.36.1", features = ["persistence"] }
egui              = "0.36.1"
wgpu              = "30.0.1"
# We own the render loop rather than eframe, so that a pass can run AFTER
# egui has drawn — see src/shell.rs. These are the versions eframe 0.36.1
# already resolved to, pinned so the two cannot drift apart.
winit             = "0.30.13"
egui-winit        = "0.36.1"
egui-wgpu         = "0.36.1"
pollster          = "1.0.1"
lyon              = "1.0.19"
bytemuck          = { version = "1.25.2", features = ["derive"] }
glam              = "0.33.5"

# --- state & general ---
serde             = { version = "1.0.229", features = ["derive"] }
ron               = "0.12.2"
thiserror         = "2.0.20"
crossbeam-channel = "0.5.16"
parking_lot       = "0.12.5"

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
